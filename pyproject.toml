[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-hailing-dynamic-pricing"
version = "0.1.0"
description = "OpenEnv multi-step ride-hailing pricing negotiation environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.25",
  "pydantic>=2.8",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.0",
]

[project.scripts]
server = "server.app:main"
